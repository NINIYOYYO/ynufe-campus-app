[project]
name = "ynufe-campus-mcp"
version = "0.2.0"
description = "云南财经大学教务系统 MCP 服务器 — 登录/成绩/课表/考试/通知/培养方案 (强智教务)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "CN059" },
]
keywords = ["mcp", "ynufe", "教务", "强智", "yunnan-university-of-finance-and-economics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.31",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ynufe_campus_mcp"]

[project.scripts]
ynufe-campus-mcp = "ynufe_campus_mcp.server:main"

[tool.uv]
package = true
