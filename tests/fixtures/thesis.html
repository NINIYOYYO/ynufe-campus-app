<script language="javascript">
	function PrintRws(id) {
		document.forms["Form1"].action = "/jsxsd/bysj/PrintRws_14073?sj1102id="+id;
		document.forms["Form1"].submit();
	}
	

	function tocxjs() {
		var xm = $("#cxzdjs").val();
		var jsktmc = $("#jsktmc").val();

		var url = "/jsxsd/bysj/xsxt.do";
		document.getElementById("Form1").action= url;
		document.getElementById("Form1").submit();
	}

	function select(id,type,obj) {
		if('cal' == type && !window.confirm("是否确定取消选择?")){
			return;
		}

		if('getzy' == type){
			var sfbzx = '';
			if(sfbzx=='1'){
             alert("当前为不在校状态，不能参与选题!");
				return false;
			}

		}

		obj.disabled = true;
		var url = "/jsxsd/bysj/toxk.do?sj1102id="+id+"&type="+type;
		if('cal' == type){
			window.Form2.action=url;
			window.Form2.target="hiddenframe";
			window.Form2.submit();

		}else{
			var iTop = (window.screen.availHeight-30-600)/2; //获得窗口的垂直位置;
			var iLeft = (window.screen.availWidth-10-600)/2; //获得窗口的水平位置;
			var ret = window.open(url,"","height=600,width=600, top="+iTop+", left="+iLeft+",scrollbars=yes,resizable=yes");
			if(undefined != ret && 'ok' == ret){
				document.Form2.action='';
				document.Form2.target="hiddenframe";
				document.Form2.submit();
			}
		}

	}

	function to_mx(id) {
		
		var url = "/jsxsd/view/bysj/kt_Mx.jsp?id="+id;
		
		var iTop = (window.screen.availHeight-30-700)/2; //获得窗口的垂直位置;
		var iLeft = (window.screen.availWidth-10-1100)/2; //获得窗口的水平位置;
		window.open(url,"","height=700, width=1100, top="+iTop+", left="+iLeft+", scrollbars=yes");
	}

	function to_rws(id,isedit,jb) {
		var height = 600;
		var width = 900;
		
		var url = "/jsxsd/view/bysj/kt_rws.jsp?id="+id+"&type=view&isedit="+isedit+"&jb="+jb;
		
		window.open(url,"","height="+height+"px; width="+width+"px;scroll:yes;");
	}
