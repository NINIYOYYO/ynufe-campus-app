# ruff.toml - Python code quality and lint configuration
line-length = 120
target-version = "py310"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PLW",  # pylint warnings
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",    # line too long
    "PLW0603", # global statement update
    "PLW2901", # loop variable overwrite
    "SIM105",  # try-except-pass vs contextlib.suppress
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
