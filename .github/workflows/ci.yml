name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.10"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node test suites
        run: npm run test

      - name: TypeScript check & Vite build
        run: npm run build

      - name: Run Python ruff lint check
        run: uv run --with ruff ruff check .

      - name: Run Python unit & native bridge tests
        run: uv run python tests/test_build_script_and_native.py

      - name: Run MCP package tests
        working-directory: mcp
        run: |
          uv run python tests/mcp_protocol_test.py
          uv run pytest

      - name: Run Structural Smoke Check
        run: uv run python test_suite.py